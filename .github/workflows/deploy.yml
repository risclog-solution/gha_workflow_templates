# XXX: This needs a .ssh folder in the root directory:
#    sudo ln -s /run/github-runner/kravagtest50/.ssh /
#    sudo chown github-runner:github-runner /.ssh

name: Deploy

on:
  workflow_call:
    inputs:
      target:
        required: true
        type: string
      repository:
        required: true
        type: string
      revision:
        description: Exact master commit to deploy using fast-forward only; empty preserves legacy branch merging
        required: false
        type: string
        default: ''
    secrets:
      CLONE_KEY:
        required: true
      SSH_PRIVATE_KEY:
        required: true
      CHAT_WEBHOOK_URL:
        description: Full HTTPS webhook URL for deployment notifications
        required: true

jobs:
  deploy:
    concurrency:
      group: deploy-${{ inputs.repository }}-${{ inputs.target }}
      cancel-in-progress: false
    runs-on:
      - self-hosted
      - nixos
    env:
      TARGET: ''
      CHAT_WEBHOOK_URL: ${{ secrets.CHAT_WEBHOOK_URL }}
    steps:
    - name: Validate notification configuration
      id: validate-webhook
      shell: bash
      run: |
        if [[ "$CHAT_WEBHOOK_URL" != https://?* ]]; then
          echo "::error::CHAT_WEBHOOK_URL must be set to a full HTTPS webhook URL."
          exit 1
        fi
    - name: Clean up
      run: |
          rm -rf "$GITHUB_WORKSPACE"
          mkdir -p "$GITHUB_WORKSPACE"
    - name: Setup SSH access - Step 1
      run: |
        mkdir -p ~/.ssh
        chmod 0700 ~/.ssh
        rm -rf ~/.ssh/known_hosts
    - name: Setup SSH access - Step 2
      run: |
        tee ~/.ssh/config << END
        ForwardAgent yes
        ServerAliveInterval 15
        ServerAliveCountMax 3

        Host flyingcircus-jump-host
            HostName dev.risclog.net
            IdentityFile ~/.ssh/identity
            User sweh

        Host *.fcio.net
            User sweh
            IdentityFile ~/.ssh/identity
            ProxyCommand ssh flyingcircus-jump-host nc -w 120 %h %p

        Host kravag*
            User sweh
            IdentityFile ~/.ssh/identity
            ProxyCommand ssh flyingcircus-jump-host nc -w 120 %h %p

        Host *
            StrictHostKeyChecking no
        END
    - name: Setup SSH access - Step 4
      run: |
        chmod 0700 ~/.ssh/config
        echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/identity
        echo "${{ secrets.CLONE_KEY }}" > ~/.ssh/id_rsa
    - name: Checkout github.com:risclog-solution/${{ inputs.repository }}.git
      run: |
        cd "$GITHUB_WORKSPACE"
        git config --global user.email "info@risclog.de"
        git config --global user.name "risclog"
        git config --global core.sshCommand "ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no -F /dev/null"
        git clone --verbose git@github.com:risclog-solution/${{ inputs.repository }}.git .
    - name: Update branch ${{ inputs.target }}
      id: update-branch
      env:
        DEPLOY_TARGET: ${{ inputs.target }}
        DEPLOY_REVISION: ${{ inputs.revision }}
      run: |
        cd "$GITHUB_WORKSPACE"
        if [[ -n "$DEPLOY_REVISION" ]]; then
          if [[ ! "$DEPLOY_REVISION" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::revision must be a full 40-character commit SHA."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$DEPLOY_REVISION" origin/master; then
            echo "::error::Requested revision is not a commit on origin/master."
            exit 1
          fi
          git checkout "$DEPLOY_TARGET"
          if ! git merge-base --is-ancestor HEAD "$DEPLOY_REVISION"; then
            echo "::error::Target branch is newer than or diverges from the requested revision."
            exit 1
          fi
          git merge --ff-only "$DEPLOY_REVISION"
          if [[ "$(git rev-parse HEAD)" != "$DEPLOY_REVISION" ]]; then
            echo "::error::Target branch does not match the requested revision."
            exit 1
          fi
          git push origin "HEAD:refs/heads/$DEPLOY_TARGET"
        else
          git checkout "$DEPLOY_TARGET"
          source="master"
          if [[ "$DEPLOY_TARGET" == "production" ]]; then
            source="staging"
          fi
          git merge "origin/$source"
          git push
        fi
    - name: Deploy to ${{ inputs.target }}
      run: |
        BUILD_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
        payload=$(printf '{"text": "%s deployment started 🚢\\n%s"}' "${{ inputs.target }}" "$BUILD_URL")
        curl --fail --silent --show-error -H 'Content-Type: application/json' -d "$payload" "$CHAT_WEBHOOK_URL"
        ./batou deploy "${{ inputs.target }}"
    - name: Report deployment failure
      if: ${{ failure() && steps.validate-webhook.outcome == 'success' }}
      run: |
        BUILD_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
        payload=$(printf '{"text": "%s deployment FAILED ⚠️\\n%s"}' "${{ inputs.target }}" "$BUILD_URL")
        curl --fail --silent --show-error -H 'Content-Type: application/json' -d "$payload" "$CHAT_WEBHOOK_URL"
